<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Confirmar invitación de equipo · Atalaya Verde</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="hero" style="padding:20px 0">
  <div class="wrap">
    <nav class="nav">
      <a class="brand" href="index.html"><i></i>Atalaya Verde</a>
    </nav>
  </div>
</header>
<main class="wrap" style="padding:48px 20px">
  <article class="page" style="max-width:560px;margin:0 auto">
    <h1>Confirmación de equipo</h1>
    <p id="statusText" class="sub">Verificando tu invitación...</p>
    <p><a class="btn-s" href="index.html">Volver al inicio</a></p>
  </article>
</main>
<script src="config.js"></script>
<script>
(function () {
  var cfg = window.AV_CONFIG || {};
  var token = new URLSearchParams(location.search).get('t') || '';
  var statusEl = document.getElementById('statusText');
  if (!token) {
    statusEl.textContent = 'Enlace incompleto: falta el token de confirmación.';
    return;
  }
  fetch(cfg.SUPABASE_URL + '/rest/v1/rpc/portal_confirm_team_member', {
    method: 'POST',
    headers: {
      'apikey': cfg.SUPABASE_KEY,
      'Authorization': 'Bearer ' + cfg.SUPABASE_KEY,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ p_confirm_token: token })
  })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d && d.ok) {
        statusEl.textContent = '¡Listo! Correo confirmado (' + (d.email || '') + '). Ya recibirás las alertas del equipo.';
      } else {
        statusEl.textContent = 'El enlace de confirmación no es válido o ya fue utilizado.';
      }
    })
    .catch(function () {
      statusEl.textContent = 'Error de conexión al confirmar la invitación.';
    });
})();
</script>
</body>
</html>

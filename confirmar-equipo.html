<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Confirmar invitación de equipo · Atalaya Verde</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="hero" style="padding:20px 0">
  <div class="wrap">
    <nav class="nav">
      <a class="brand" href="index.html"><i></i>Atalaya Verde</a>
    </nav>
  </div>
</header>
<main class="wrap" style="padding:48px 20px">
  <article class="page" style="max-width:560px;margin:0 auto">
    <h1>Invitación de equipo</h1>
    <p id="statusText" class="sub">Pulsa un botón para confirmar o rechazar tu suscripción a las alertas de este equipo.</p>
    <div id="actionRow" style="display:flex;gap:12px;flex-wrap:wrap;margin:18px 0">
      <button id="confirmBtn" class="btn-p" type="button">Confirmar invitación</button>
      <button id="rejectBtn" class="btn-s" type="button">Rechazar invitación</button>
    </div>
    <p><a class="btn-s" href="index.html">Volver al inicio</a></p>
  </article>
</main>
<footer><div class="wrap"><a href="index.html">Inicio</a> · <a href="privacidad.html">Política de privacidad</a> · <a href="aviso-legal.html">Aviso legal</a> · <a href="cookies.html">Cookies</a> · <a href="condiciones.html">Condiciones de contratación</a></div></footer>
<script src="config.js"></script>
<script>
(function () {
  var cfg = window.AV_CONFIG || {};
  var params = new URLSearchParams(location.search);
  var token = params.get('t') || '';
  var action = params.get('action') || '';
  var statusEl = document.getElementById('statusText');
  var rowEl = document.getElementById('actionRow');
  var confirmBtn = document.getElementById('confirmBtn');
  var rejectBtn = document.getElementById('rejectBtn');

  if (token && window.history && window.history.replaceState) {
    window.history.replaceState(null, '', location.pathname);
  }
  if (!token) {
    statusEl.textContent = 'Enlace incompleto: falta el token de invitación.';
    rowEl.hidden = true;
    return;
  }
  if (action === 'leave') {
    confirmBtn.hidden = true;
    rejectBtn.textContent = 'Darme de baja del equipo';
  }

  function callTeamRpc(rpcName, argName, onOkMsg) {
    confirmBtn.disabled = true;
    rejectBtn.disabled = true;
    statusEl.textContent = 'Procesando...';
    var body = {};
    body[argName] = token;
    fetch(cfg.SUPABASE_URL + '/rest/v1/rpc/' + rpcName, {
      method: 'POST',
      headers: {
        'apikey': cfg.SUPABASE_KEY,
        'Authorization': 'Bearer ' + cfg.SUPABASE_KEY,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body)
    })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.ok) {
          rowEl.hidden = true;
          statusEl.textContent = onOkMsg(d);
        } else {
          confirmBtn.disabled = false;
          rejectBtn.disabled = false;
          statusEl.textContent = 'Este enlace ha caducado o ya fue utilizado.';
        }
      })
      .catch(function () {
        confirmBtn.disabled = false;
        rejectBtn.disabled = false;
        statusEl.textContent = 'Error de conexión. Inténtalo de nuevo.';
      });
  }

  confirmBtn.addEventListener('click', function () {
    callTeamRpc('portal_confirm_team_member', 'p_confirm_token', function (d) {
      return '¡Listo! Correo confirmado (' + (d.email || '') + '). Ya recibirás las alertas del equipo.';
    });
  });

  rejectBtn.addEventListener('click', function () {
    if (action === 'leave') {
      callTeamRpc('portal_unsubscribe_team_member', 'p_unsub_token', function () {
        return 'Baja completada. Ya no recibirás más alertas de este equipo.';
      });
    } else {
      callTeamRpc('portal_reject_team_member', 'p_confirm_token', function () {
        return 'Invitación rechazada. No recibirás correos de este equipo.';
      });
    }
  });
})();
</script>
</body>
</html>
